const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');

const n0 = v => Math.round(v).toLocaleString('en-IN');

// ---------- dates & periods
const D = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const days = (a, b) => Math.round((D(b) - D(a)) / 864e5) + 1;
const fmtD = s => D(s).toLocaleDateString('en-IN', {day:'numeric', month:'short', timeZone:'UTC'});
const T = DATA.asof;
const mStart = s => s.slice(0, 8) + '01';
const fyStart = s => { const y = +s.slice(0,4), m = +s.slice(5,7); return (m >= 4 ? y : y - 1) + '-04-01'; };
const PERIODS = {
  today: {lab:'Today', r:() => [T, T], prev:() => [add(T,-1), add(T,-1)], pl:'yesterday'},
  yday:  {lab:'Yesterday', r:() => [add(T,-1), add(T,-1)], prev:() => [add(T,-8), add(T,-8)], pl:'same day last week'},
  mtd:   {lab:'MTD', r:() => [mStart(T), T], prev:() => { const s = mStart(add(mStart(T),-1)); const e = add(s, days(mStart(T),T)-1); const le = add(mStart(T),-1); return [s, e < le ? e : le]; }, pl:'same days last month'},
  lm:    {lab:'Last month', r:() => [mStart(add(mStart(T),-1)), add(mStart(T),-1)], prev:() => { const s = mStart(add(mStart(T),-1)); return [mStart(add(s,-1)), add(s,-1)]; }, pl:'month before'},
  l30:   {lab:'Last 30 days', r:() => [add(T,-29), T], prev:() => [add(T,-59), add(T,-30)], pl:'previous 30 days'},
  l90:   {lab:'Last 90 days', r:() => [add(T,-89), T], prev:() => [add(T,-179), add(T,-90)], pl:'previous 90 days'},
  fy:    {lab:'FY to date', r:() => [fyStart(T), T], prev:null},
};
const inR = (d, [a, b]) => d >= a && d <= b;
const S = {view:'overview', per:'mtd', trend:'d30', brand:'All', sort:{k:'t', d:-1}, stockAll:false};

function sumDaily(r) {
  const o = {o:0, g:0, n:0, t:0, q:0};
  for (const x of DATA.daily) if (inR(x[0], r)) { o.o += x[1]; o.g += x[2]; o.n += x[3]; o.t += x[4]; o.q += x[5]; }
  return o;
}
const lineRows = r => DATA.lines.filter(x => inR(x[0], r));
function delta(cur, prev) {
  if (prev == null) return '';
  if (!prev) return cur ? '<span class="up">▲ new</span> vs ' : '<span class="muted">— </span>vs ';
  const p = (cur - prev) / prev * 100;
  return `<span class="${p >= 0 ? 'up' : 'dn'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%</span> vs `;
}

  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.max(8, e.clientY - tip.offsetHeight - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
const hideTip = () => tip.style.display = 'none';
document.addEventListener('scroll', hideTip, true);

document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) { S.view = v.dataset.v; render(); scrollTo(0, 0); return; }
  const p = e.target.closest('[data-per]'); if (p) { S.per = p.dataset.per; render(); return; }
  const t = e.target.closest('[data-trend]'); if (t) { S.trend = t.dataset.trend; render(); return; }
  const br = e.target.closest('[data-brand]'); if (br) { S.brand = br.dataset.brand; render(); return; }
  const k = e.target.closest('th[data-k]'); if (k) { S.sort = {k:k.dataset.k, d:S.sort.k === k.dataset.k ? -S.sort.d : -1}; render(); return; }
  const sa = e.target.closest('[data-stockall]'); if (sa) { S.stockAll = sa.dataset.stockall === '1'; render(); }
});
const perChips = () => `<div class="chips" role="group" aria-label="Period">${Object.entries(PERIODS).map(([k, p]) =>
  `<button class="chip" data-per="${k}" aria-pressed="${S.per === k}">${p.lab}</button>`).join('')}</div>`;
const rangeLab = r => r[0] === r[1] ? fmtD(r[0]) : `${fmtD(r[0])} – ${fmtD(r[1])}`;

// ---------- overview
function trendData() {
  if (S.trend === 'm12') {
    const out = []; let m = mStart(T);
    for (let i = 0; i < 12; i++) { out.unshift(m); m = mStart(add(m, -1)); }
    return out.map(ms => { const me = add(mStart(add(ms, 32)), -1); const s = sumDaily([ms, me]);
      return {k: ms, lab: D(ms).toLocaleDateString('en-IN', {month:'short', timeZone:'UTC'}), full: D(ms).toLocaleDateString('en-IN', {month:'long', year:'numeric', timeZone:'UTC'}), ...s}; });
  }
  const n = S.trend === 'd90' ? 90 : 30;
  return Array.from({length:n}, (_, i) => { const d = add(T, i - n + 1); const s = sumDaily([d, d]);
    return {k:d, lab:fmtD(d), full:D(d).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'}), ...s}; });
}
function barChart(rows) {
  const W = 640, H = 220, L = 46, R = 8, Tp = 10, B = 26, iw = W - L - R, ih = H - Tp - B;
  const max = Math.max(1, ...rows.map(r => r.t));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = iw / rows.length, gap = Math.max(2, Math.min(6, bw * .25));
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) { const y = Tp + ih - v / top * ih;
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${v >= 1000 ? (v/1000) + 'k' : v}</text>`; }
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => { const x = L + i * bw, h = r.t / top * ih, y = Tp + ih - h, w = Math.max(1, bw - gap);
    if (h > 0) g += `<path d="M${x + gap/2},${Tp + ih} v${-Math.max(h - 3, 0)} q0,-3 3,-3 h${Math.max(w - 6, 0)} q3,0 3,3 v${Math.max(h - 3, 0)} z" fill="var(--bar)"/>`;
    g += `<rect class="hit" data-i="${i}" x="${x}" y="${Tp}" width="${bw}" height="${ih}" fill="transparent"/>`;
    if (i % every === 0 || i === rows.length - 1 && rows.length <= 12) g += `<text x="${x + bw/2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${r.lab}</text>`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${Tp + ih}" y2="${Tp + ih}" stroke="var(--axis)"/>`;
  return `<svg id="trend" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Revenue by ${S.trend === 'm12' ? 'month' : 'day'}">${g}</svg>`;
}
function niceStep(max) { const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function brandAgg(rows) {
  const m = {}; for (const x of rows) { const o = m[x[3]] ??= {b:x[3], o:0, g:0, t:0, q:0}; o.o += x[4]; o.g += x[5]; o.t += x[7]; o.q += x[8]; }
  return BRANDS.map(b => m[b]).filter(Boolean);
}
function hbars(items, val, lab) {
  const tot = items.reduce((a, x) => a + val(x), 0) || 1, max = Math.max(...items.map(val), 1);
  return `<div class="hb">${items.map(x => `<div class="nm">${sw(x.b)}${esc(x.b)}</div><div class="tr"><div class="fl" style="width:${val(x)/max*100}%;background:${bcol(x.b)}"></div></div><div class="vl">${lab(x)}<small>${(val(x)/tot*100).toFixed(0)}%</small></div>`).join('')}</div>`;
}
function overview() {
  const P = PERIODS[S.per], r = P.r(), pr = P.prev ? P.prev() : null;
  const c = sumDaily(r), p = pr ? sumDaily(pr) : null;
  const aov = c.o ? c.t / c.o : 0, paov = p && p.o ? p.t / p.o : null;
  const dl = (a, b) => p ? delta(a, b) + P.pl : '&nbsp;';
  const kp = [
    ['Revenue', inr(c.t), dl(c.t, p?.t)],
    ['Orders', n0(c.o), dl(c.o, p?.o)],
    ['Units sold', n0(c.q), dl(c.q, p?.q)],
    ['Avg order value', c.o ? inr(aov) : '—', p ? (c.o && paov ? delta(aov, paov) + P.pl : '&nbsp;') : '&nbsp;'],
    ['Gross sales (ex-GST)', inr(c.g), 'before tax &amp; shipping'],
  ];
  const ba = brandAgg(lineRows(r)).sort((a, b) => b.g - a.g);
  const prods = {}; for (const x of lineRows(r)) { const o = prods[x[1]] ??= {p:x[1], b:x[3], o:0, q:0, t:0}; o.o += x[4]; o.q += x[8]; o.t += x[7]; }
  const top = Object.values(prods).sort((a, b) => b.t - a.t).slice(0, 8);
  const tr = trendData(), tt = tr.reduce((a, x) => a + x.t, 0), to = tr.reduce((a, x) => a + x.o, 0);
  return perChips() + `
  <div class="kpis">${kp.map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('')}</div>
  <div class="grid2">
   <div class="card"><div class="ch"><div><h3>Revenue trend</h3><div class="cs">${inr(tt)} from ${n0(to)} orders</div></div>
    <div class="seg" role="group" aria-label="Trend range">${[['d30','30 days'],['d90','90 days'],['m12','12 months']].map(([k, l]) => `<button data-trend="${k}" aria-pressed="${S.trend === k}">${l}</button>`).join('')}</div></div>
    ${barChart(tr)}</div>
   <div class="card"><h3>Brand mix</h3><div class="cs">Gross sales (ex-GST), ${rangeLab(r)}</div>
    ${ba.length ? hbars(ba, x => x.g, x => inr(x.g)) : '<div class="empty">No sales in this period.</div>'}</div>
  </div>
  <div class="card"><h3>Top products</h3><div class="cs">${PERIODS[S.per].lab} · ${rangeLab(r)}</div>
   ${top.length ? `<div class="tw"><table><thead><tr><th>Product</th><th>Orders</th><th>Units</th><th>Revenue</th></tr></thead><tbody>
   ${top.map(x => `<tr><td>${sw(x.b)} ${esc(x.p)}</td><td>${x.o}</td><td>${x.q}</td><td>${inr(x.t)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No sales in this period.</div>'}
  </div>`;
}
function wireTrend() {
  const svg = $('#trend'); if (!svg) return; const rows = trendData();
  svg.addEventListener('pointermove', e => { const h = e.target.closest('.hit'); if (!h) return hideTip(); const r = rows[+h.dataset.i];
    showTip(e, `<b>${r.full}</b>Revenue ${inr(r.t)}<br>Orders ${r.o} · Units ${r.q}`); });
  svg.addEventListener('pointerleave', hideTip);
}

// ---------- products
function products() {
  const r = PERIODS[S.per].r(); const rows = lineRows(r);
  const brands = ['All', ...brandAgg(rows).map(x => x.b)];
  if (!brands.includes(S.brand)) S.brand = 'All';
  const m = {};
  for (const x of rows) { if (S.brand !== 'All' && x[3] !== S.brand) continue;
    const key = x[1] + '|' + x[2]; const o = m[key] ??= {b:x[3], p:x[1], v:x[2] === 'Default Title' ? '' : x[2], o:0, q:0, g:0, t:0};
    o.o += x[4]; o.q += x[8]; o.g += x[5]; o.t += x[7]; }
  const k = S.sort.k, d = S.sort.d;
  const items = Object.values(m);
  const groups = BRANDS.map(b => ({b, it: items.filter(x => x.b === b).sort((a, c) => (a[k] > c[k] ? 1 : a[k] < c[k] ? -1 : 0) * d)})).filter(g => g.it.length);
  const tot = items.reduce((a, x) => ({o:a.o + x.o, q:a.q + x.q, g:a.g + x.g, t:a.t + x.t}), {o:0, q:0, g:0, t:0});
  const arrow = c => S.sort.k === c ? (S.sort.d < 0 ? ' ▾' : ' ▴') : '';
  const sum = it => it.reduce((a, x) => ({o:a.o + x.o, q:a.q + x.q, g:a.g + x.g, t:a.t + x.t}), {o:0, q:0, g:0, t:0});
  const body = groups.map(g => { const s = sum(g.it);
    return `<tr class="grp"><td>${sw(g.b)} ${esc(g.b)}</td><td></td><td>${s.o}</td><td>${s.q}</td><td>${inr(s.g)}</td><td>${inr(s.t)}</td><td>${(s.t / (tot.t || 1) * 100).toFixed(0)}%</td></tr>` +
      g.it.map(x => `<tr><td class="l">${esc(x.p)}</td><td class="l">${esc(x.v) || '<span class="muted">—</span>'}</td><td>${x.o}</td><td>${x.q}</td><td>${inr(x.g)}</td><td>${inr(x.t)}</td><td>${(x.t / (tot.t || 1) * 100).toFixed(0)}%</td></tr>`).join(''); }).join('');
  return perChips() + `<div class="chips" role="group" aria-label="Brand">${brands.map(b => `<button class="chip" data-brand="${esc(b)}" aria-pressed="${S.brand === b}">${b === 'All' ? 'All brands' : sw(b) + ' ' + esc(b)}</button>`).join('')}</div>
  <div class="card"><h3>${S.brand === 'All' ? 'All brands' : esc(S.brand)}</h3><div class="cs">${rangeLab(r)} · tap a column to sort</div>
  ${items.length ? `<div class="tw"><table><thead><tr><th class="l">Product</th><th class="l">Flavour</th><th data-k="o">Orders${arrow('o')}</th><th data-k="q">Units${arrow('q')}</th><th data-k="g">Gross ex-GST${arrow('g')}</th><th data-k="t">Revenue${arrow('t')}</th><th>Share</th></tr></thead>
  <tbody>${body}</tbody><tfoot><tr class="tot"><td>Total</td><td></td><td>${tot.o}</td><td>${tot.q}</td><td>${inr(tot.g)}</td><td>${inr(tot.t)}</td><td>100%</td></tr></tfoot></table></div>` : '<div class="empty">No sales in this period.</div>'}
  </div>`;
}

// ---------- stock
function stock() {
  const r90 = [add(T, -89), T]; const sold = {};
  for (const x of lineRows(r90)) { const k = x[1] + '|' + x[2]; sold[k] = (sold[k] || 0) + x[8]; }
  const all = DATA.inv.map(x => { const s = sold[x[0] + '|' + x[1]] || 0, rate = s / 90;
    return {p:x[0], v:x[1] === 'Default Title' ? '' : x[1], sku:x[2], st:x[3], price:x[4], q:x[5], b:x[6], s90:s, cover: rate ? x[5] / rate : null}; });
  const rows = all.filter(x => S.stockAll || x.st === 'ACTIVE');
  const act = all.filter(x => x.st === 'ACTIVE');
  const zero = act.filter(x => x.q <= 0), low = act.filter(x => x.q > 0 && x.q < 20);
  const byB = BRANDS.map(b => ({b, q: rows.filter(x => x.b === b).reduce((a, x) => a + Math.max(0, x.q), 0), v: rows.filter(x => x.b === b).reduce((a, x) => a + Math.max(0, x.q) * x.price, 0)})).filter(x => x.q);
  const flag = x => x.st !== 'ACTIVE' ? '<span class="pill">draft</span>' : x.q <= 0 ? '<span class="pill bad">✕ out of stock</span>' : x.q < 20 ? '<span class="pill warn">! low</span>' : x.cover != null && x.cover < 30 ? '<span class="pill warn">! &lt;30 days</span>' : '<span class="pill ok">✓ ok</span>';
  const sorted = BRANDS.flatMap(b => rows.filter(x => x.b === b).sort((a, c) => a.q - c.q));
  return `<div class="chips" role="group" aria-label="Products shown"><button class="chip" data-stockall="0" aria-pressed="${!S.stockAll}">Live products</button><button class="chip" data-stockall="1" aria-pressed="${S.stockAll}">Include drafts</button></div>
  <div class="kpis">
   <div class="kpi"><div class="l">Units on hand</div><div class="v">${n0(byB.reduce((a, x) => a + x.q, 0))}</div><div class="d">stock value ${inrS(byB.reduce((a, x) => a + x.v, 0))} at MRP</div></div>
   <div class="kpi"><div class="l">Live SKUs</div><div class="v">${act.length}</div><div class="d">${all.length - act.length} in draft</div></div>
   <div class="kpi"><div class="l">Out of stock</div><div class="v ${zero.length ? 'dn' : ''}">${zero.length}</div><div class="d">live SKUs at zero</div></div>
   <div class="kpi"><div class="l">Low stock</div><div class="v">${low.length}</div><div class="d">live SKUs under 20 units</div></div>
   <div class="kpi"><div class="l">Sold, last 90 days</div><div class="v">${n0(Object.values(sold).reduce((a, x) => a + x, 0))}</div><div class="d">units</div></div>
  </div>
  <div class="card"><h3>Units on hand by brand</h3><div class="cs">${S.stockAll ? 'Live and draft products' : 'Live products only'}</div>${hbars(byB, x => x.q, x => n0(x.q))}</div>
  <div class="card"><h3>SKU stock</h3><div class="cs">Days of cover = stock ÷ average daily units sold over the last 90 days</div>
  <div class="tw"><table><thead><tr><th class="l">Product</th><th class="l">Flavour</th><th class="l">SKU</th><th>Price</th><th>Stock</th><th>Sold 90d</th><th>Days cover</th><th class="l">Status</th></tr></thead><tbody>
  ${sorted.map(x => `<tr><td>${sw(x.b)} ${esc(x.p)}</td><td class="l">${esc(x.v) || '<span class="muted">—</span>'}</td><td class="l muted">${esc(x.sku) || '—'}</td><td>${inr(x.price)}</td><td>${n0(x.q)}</td><td>${x.s90 || '<span class="muted">0</span>'}</td><td>${x.cover == null ? '<span class="muted">no sales</span>' : x.cover > 999 ? '999+' : n0(x.cover)}</td><td class="l">${flag(x)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

// ---------- orders
function orders() {
  const os = DATA.orders, live = os.filter(o => !o.x);
  const st = {}; for (const o of live) { const s = st[o.st || '—'] ??= {s:o.st || '—', o:0, t:0}; s.o++; s.t += o.amt; }
  const states = Object.values(st).sort((a, b) => b.t - a.t);
  const rep = live.filter(o => o.rep).length, unf = live.filter(o => o.ful !== 'FULFILLED').length;
  const first = os.length ? os[os.length - 1].t.slice(0, 10) : T;
  const stp = o => o.x ? '<span class="pill bad">✕ cancelled</span>' : (o.ful === 'FULFILLED' ? '<span class="pill ok">✓ fulfilled</span>' : `<span class="pill warn">! ${esc(o.ful.toLowerCase().replace(/_/g, ' '))}</span>`) + (o.fin === 'PAID' ? '' : ` <span class="pill">${esc(o.fin.toLowerCase().replace(/_/g, ' '))}</span>`);
  return `<div class="kpis">
   <div class="kpi"><div class="l">Orders shown</div><div class="v">${os.length}</div><div class="d">since ${D(first).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'})}</div></div>
   <div class="kpi"><div class="l">Average order</div><div class="v">${live.length ? inr(live.reduce((a, o) => a + o.amt, 0) / live.length) : '—'}</div><div class="d">incl. GST &amp; shipping</div></div>
   <div class="kpi"><div class="l">Not yet fulfilled</div><div class="v ${unf ? 'dn' : ''}">${unf}</div><div class="d">open orders</div></div>
   <div class="kpi"><div class="l">Repeat buyers</div><div class="v">${live.length ? Math.round(rep / live.length * 100) : 0}%</div><div class="d">${rep} orders from returning customers</div></div>
   <div class="kpi"><div class="l">States reached</div><div class="v">${states.length}</div><div class="d">ship-to locations</div></div>
  </div>
  <div class="card"><h3>Latest orders</h3><div class="cs">Newest first</div><div class="orders">
  ${os.slice(0, 40).map(o => `<div class="oc"><div class="h"><span>${esc(o.n)}</span><span>${inr(o.amt)}</span></div>
   <div class="m">${D(o.t.slice(0,10)).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'})}, ${o.t.slice(11)} · ${esc([o.city, o.st].filter(Boolean).join(', ') || '—')}</div>
   <ul>${o.it.map(i => `<li>${sw(i[3])}<span>${esc(i[0])}${i[1] ? ' — ' + esc(i[1]) : ''}</span><b style="margin-left:auto">×${i[2]}</b></li>`).join('')}</ul>
   <div class="ps">${stp(o)}${o.rep ? ' <span class="pill">repeat buyer</span>' : ''}</div></div>`).join('')}
  </div></div>
  <div class="card"><h3>Orders by state</h3><div class="cs">Across the ${os.length} orders above, cancelled excluded</div>
  <div class="tw"><table><thead><tr><th>State</th><th>Orders</th><th>Revenue</th><th>Share</th></tr></thead><tbody>
  ${states.map(s => `<tr><td>${esc(s.s)}</td><td>${s.o}</td><td>${inr(s.t)}</td><td>${(s.o / live.length * 100).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div></div>`;
}

function render() {
  nav(); hideTip();
  const v = VIEWS[S.view]; $('#ttl').textContent = v.t; $('#dsc').textContent = v.d;
  $('#view').innerHTML = ({overview, products, stock, orders})[S.view]();
  if (S.view === 'overview') wireTrend();
}
$('#gen1').textContent = DATA.gen; $('#gen2').textContent = 'Updated ' + DATA.gen;
render();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body></html>
